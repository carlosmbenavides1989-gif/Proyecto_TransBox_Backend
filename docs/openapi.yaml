openapi: 3.0.3
info:
  title: TransBox API
  version: 1.0.0-evidencia
  description: Servicios web incluidos en la evidencia GA7-220501096-AA5-EV03.
servers:
  - url: http://localhost:8080
    description: Servidor local
security:
  - basicAuth: []
paths:
  /api/usuarios:
    get:
      summary: Listar usuarios
      responses:
        '200': { description: Consulta exitosa }
    post:
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuario'
      responses:
        '201': { description: Usuario creado }
        '409': { description: Correo o documento duplicado }
  /api/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Consultar usuario por ID
      responses:
        '200': { description: Usuario encontrado }
        '404': { description: Usuario no encontrado }
    put:
      summary: Actualizar usuario
      responses:
        '200': { description: Usuario actualizado }
        '404': { description: Usuario no encontrado }
  /api/usuarios/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Cambiar estado de usuario
      responses:
        '200': { description: Estado actualizado }
  /api/roles:
    get:
      summary: Listar roles
      responses:
        '200': { description: Consulta exitosa }
  /api/pedidos:
    get:
      summary: Listar pedidos
      responses:
        '200': { description: Consulta exitosa }
    post:
      summary: Crear pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedido'
      responses:
        '201': { description: Pedido creado }
  /api/pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Consultar pedido
      responses:
        '200': { description: Pedido encontrado }
        '404': { description: Pedido no encontrado }
  /api/pedidos/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Cambiar estado del pedido
      responses:
        '200': { description: Estado actualizado }
  /api/franjas:
    get:
      summary: Listar franjas
      responses:
        '200': { description: Consulta exitosa }
    post:
      summary: Crear franja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearFranja'
      responses:
        '201': { description: Franja creada }
  /api/franjas/disponibles:
    get:
      summary: Listar franjas disponibles
      responses:
        '200': { description: Consulta exitosa }
  /api/franjas/{id}/reservar:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      summary: Reservar un cupo
      responses:
        '200': { description: Cupo reservado }
        '409': { description: Sin cupos disponibles }
  /api/vehiculos:
    get:
      summary: Listar vehículos
      responses:
        '200': { description: Consulta exitosa }
    post:
      summary: Registrar vehículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearVehiculo'
      responses:
        '201': { description: Vehículo registrado }
        '409': { description: Placa duplicada }
  /api/vehiculos/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      summary: Cambiar estado de vehículo
      responses:
        '200': { description: Estado actualizado }
        '404': { description: Vehículo no encontrado }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    RegistroUsuario:
      type: object
      required: [nombres, apellidos, correo, documento, contrasena]
      properties:
        nombres: { type: string }
        apellidos: { type: string }
        correo: { type: string, format: email }
        telefono: { type: string }
        documento: { type: string }
        contrasena: { type: string, minLength: 12 }
    CrearPedido:
      type: object
      required: [clienteNombre, direccionEntrega]
      properties:
        clienteNombre: { type: string }
        direccionEntrega: { type: string }
        descripcion: { type: string }
    CrearFranja:
      type: object
      required: [fecha, horaInicio, horaFin, cuposDisponibles]
      properties:
        fecha: { type: string, format: date }
        horaInicio: { type: string, example: '08:00:00' }
        horaFin: { type: string, example: '10:00:00' }
        cuposDisponibles: { type: integer, minimum: 1 }
    CrearVehiculo:
      type: object
      required: [placa, tipo]
      properties:
        placa: { type: string }
        tipo: { type: string }
        marca: { type: string }
        capacidadKg: { type: number, format: double }
